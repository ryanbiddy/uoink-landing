<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Uoink · OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=JetBrains+Mono:wght@700&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Bungee&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#FF3D00}
  .card{position:relative;width:1200px;height:630px;background:#FF3D00;color:#0A0A0A;display:flex;flex-direction:column;justify-content:space-between;padding:0;border:6px solid #0A0A0A}
  .top{background:#0A0A0A;color:#FFF4EC;padding:18px 48px;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.22em;text-transform:uppercase;display:flex;justify-content:space-between;font-weight:700}
  .top b{color:#FF3D00;font-weight:700}
  .top .star{color:#FFD23F}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:48px;text-align:center}
  .wm{display:inline-flex;align-items:flex-end;font-family:'Bungee',sans-serif;font-size:240px;line-height:.86;letter-spacing:-0.025em;color:#0A0A0A}
  .wm .my{flex-shrink:0;height:.84em;width:.66em;margin-right:.02em;align-self:flex-end;display:block}
  .wm .my svg{display:block;width:100%;height:100%}
  .tag{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:42px;color:#0A0A0A;letter-spacing:-0.005em;max-width:24ch;line-height:1.05}
  .domain{display:inline-flex;align-items:center;background:#0A0A0A;color:#FFF4EC;padding:14px 30px;font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:.04em;font-weight:700}
  .domain .dot{color:#FF3D00;margin:0 2px}
  .domain .tld{color:#FFD23F}
  .stamp{position:absolute;right:48px;top:120px;width:130px;height:130px;border:4px solid #0A0A0A;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0A0A0A;line-height:1.1;font-weight:700;background:#FFD23F}
  .stamp b{display:block;font-size:22px;letter-spacing:.02em;margin:3px 0;font-weight:700}
  .bot{background:#0A0A0A;color:#FFD23F;padding:18px 48px;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.22em;text-transform:uppercase;display:flex;justify-content:space-between;font-weight:700}
  .bot b{color:#FF3D00;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><span><span class="star">★</span> <b>UOINK v2.0</b> · the YouTube layer for any AI</span><span>uoink.video</span></div>
    <div class="stage">
      <div class="wm">
        <span class="my">
          <svg viewBox="0 0 100 100"><path d="M 0 0 L 32 0 L 32 60 L 68 60 L 68 0 L 100 0 L 100 80 Q 100 100 80 100 L 20 100 Q 0 100 0 80 Z" fill="#0A0A0A"/><rect x="0" y="0" width="32" height="14" fill="#FFD23F"/><rect x="68" y="0" width="32" height="14" fill="#FFD23F"/></svg>
        </span>OINK
      </div>
      <div class="tag">Uoink any video.<br/>Read it like a doc.</div>
      <div class="domain">uoink<span class="dot">.</span><span class="tld">video</span></div>
    </div>
    <div class="stamp">UOINKED<b>v2.0</b>★ SEALED ★</div>
    <div class="bot"><span>WINDOWS · MAC v2.1 · OPEN · MIT</span><span>13 <b>MCP</b> TOOLS</span></div>
  </div>
</body>
</html>
